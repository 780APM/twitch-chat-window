name: Verify published pacman repository

on:
  workflow_dispatch:
    inputs:
      fingerprint:
        description: Expected public package-signing key fingerprint
        required: true
        type: string
        default: CDD0942F17CAD1625B4E67F89711FF2636622D60
      expected_tag:
        description: Expected application release tag
        required: true
        type: string
        default: v1.3.0
  workflow_call:
    inputs:
      fingerprint:
        required: true
        type: string
      expected_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Install by name with package and database signature checks
        env:
          FINGERPRINT: ${{ inputs.fingerprint }}
          EXPECTED_TAG: ${{ inputs.expected_tag }}
        run: |
          docker run --rm --init -i -e FINGERPRINT -e EXPECTED_TAG \
            -v "$PWD/linux/install-cachyos.sh:/install.sh:ro" archlinux:base bash -euo pipefail <<'SCRIPT'
          [[ "$FINGERPRINT" =~ ^[0-9A-F]{40}$ ]]
          [[ "$EXPECTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          pacman -Syu --needed --noconfirm curl gnupg
          server=https://github.com/780APM/twitch-chat-window/releases/latest/download
          curl -fLsS "$server/twitch-chat-window.asc" -o /tmp/twitch-chat-window.asc
          actual=$(gpg --batch --show-keys --with-colons /tmp/twitch-chat-window.asc |
            awk -F: '$1 == "pub" { primary = 1; next } primary && $1 == "fpr" { print $10; primary = 0 }')
          [[ "$actual" == "$FINGERPRINT" ]]
          pacman-key --init
          bash /install.sh --non-interactive
          # The base container's NoExtract rules intentionally skip package documentation.
          pacman -Q twitch-chat-window
          installed=$(pacman -Q twitch-chat-window | awk '{print $2}')
          [[ "$installed" == "${EXPECTED_TAG#v}-"* ]]
          test -x /usr/bin/twitch-chat-window
          test -s /usr/lib/twitch-chat-window/twitch-chat-window.dll
          test -s /usr/share/applications/io.github._780APM.TwitchChatWindow.desktop
          test -s /usr/share/icons/hicolor/512x512/apps/twitch-chat-window.png
          SCRIPT
