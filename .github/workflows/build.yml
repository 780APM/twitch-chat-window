name: Build desktop downloads

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Build and test Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' linux/TwitchChatWindow.Linux.csproj)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev librsvg2-dev libgirepository1.0-dev gobject-introspection libicu-dev libssl-dev patchelf squashfs-tools desktop-file-utils
      - name: Build AppImage with bundled GTK and .NET
        run: ./linux/build-appimage.sh
      - name: Test bundled globalization and secure network dependencies
        run: |
          dotnet publish linux/tests/chat/ChatSmoke.csproj -c Release -r linux-x64 --self-contained -o out/chat-smoke
          ./linux/check-appimage-network.sh out/TwitchChatWindow-x86_64.AppImage out/chat-smoke
      - name: Test AppImage on Arch KDE Wayland
        run: |
          mkdir -p out/appimage-test
          cp out/TwitchChatWindow-x86_64.AppImage linux/smoke-linux.sh linux/check-window.py out/appimage-test/
          cp -r linux/tests out/appimage-test/
          docker run --rm --init -v "$PWD/out/appimage-test:/input:ro" archlinux:base-devel bash -euc '
            pacman -Syu --noconfirm --needed kwin kglobalacceld gtk3 desktop-file-utils ttf-dejavu python wayland xorg-xwayland
            useradd --create-home overlay-test
            cp /usr/bin/kwin_wayland /tmp/kwin_wayland
            runuser -u overlay-test -- bash -euc "cd /home/overlay-test
              cp /input/TwitchChatWindow-x86_64.AppImage .
              chmod +x TwitchChatWindow-x86_64.AppImage
              APPIMAGE_EXTRACT_AND_RUN=1 dbus-run-session -- bash /input/smoke-linux.sh \
                /home/overlay-test/TwitchChatWindow-x86_64.AppImage /tmp/kwin_wayland
            "
          '
      - uses: actions/upload-artifact@v4
        with:
          name: TwitchChatWindow-AppImage
          path: out/TwitchChatWindow-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Build Windows EXE
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: .\Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TwitchChatWindow-windows
          path: TwitchChatWindow.exe
          if-no-files-found: error

  release:
    name: Publish Windows and Linux downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the two application downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp linux/RELEASE-NOTES.md /tmp/release-notes.md
          printf '\n<details><summary>Download checksums (SHA-256)</summary>\n\n```text\n' >> /tmp/release-notes.md
          (cd release && sha256sum *) >> /tmp/release-notes.md
          printf '```\n</details>\n' >> /tmp/release-notes.md
          gh release create "$RELEASE_TAG" release/* --verify-tag --latest \
            --title "Twitch Chat Window $RELEASE_TAG" --notes-file /tmp/release-notes.md
