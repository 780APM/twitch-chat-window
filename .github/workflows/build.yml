name: Build desktop downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Build and check Wayland overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Build Linux x64
        run: dotnet publish linux/TwitchChatWindow.Linux.csproj -c Release -r linux-x64 --self-contained -p:DebugType=None -o out/TwitchChatWindow
      - name: Package portable Linux download
        run: |
          cp README.md out/TwitchChatWindow/README.md
          notices=out/TwitchChatWindow/licenses
          mkdir "$notices"
          cp "$DOTNET_ROOT/LICENSE.txt" "$notices/dotnet-license.txt"
          cp "$DOTNET_ROOT/ThirdPartyNotices.txt" "$notices/dotnet-third-party-notices.txt"
          cp /usr/share/common-licenses/LGPL-2 "$notices/gtksharp-license.txt"
          printf '%s\n' 'GtkSharp 3.24.24.95 source code' 'https://github.com/GtkSharp/GtkSharp' > "$notices/gtksharp-source.txt"
          tar -C out -czf TwitchChatWindow-linux-x64.tar.gz TwitchChatWindow
      - name: Build and test the pacman package on Arch Linux with KWin
        run: |
          mkdir -p out/pacman-input out/pacman
          cp linux/arch/PKGBUILD linux/arch/*.desktop linux/smoke-wayland.sh branding/mark.png \
            TwitchChatWindow-linux-x64.tar.gz out/pacman-input/
          docker run --rm --init -v "$PWD/out/pacman-input:/input:ro" -v "$PWD/out/pacman:/output" \
            archlinux:base-devel bash -euc '
              pacman -Syu --noconfirm --needed desktop-file-utils kwin ttf-dejavu
              useradd --create-home overlay-test
              runuser -u overlay-test -- bash -euc "cd /home/overlay-test
                cp /input/* .
                makepkg --geninteg >> PKGBUILD
                makepkg --nodeps --noconfirm
              "
              package=(/home/overlay-test/twitch-chat-window-*.pkg.tar.zst)
              pacman -U --noconfirm -- "${package[0]}"
              desktop-file-validate /usr/share/applications/io.github._780APM.TwitchChatWindow.desktop
              test -s /usr/share/icons/hicolor/512x512/apps/twitch-chat-window.png
              # Copy the compositor without its host scheduling capability for the virtual output.
              cp /usr/bin/kwin_wayland /tmp/kwin_wayland
              runuser -u overlay-test -- dbus-run-session -- bash /input/smoke-wayland.sh /usr/bin/twitch-chat-window /tmp/kwin_wayland
              install -m644 -- "${package[0]}" /output/
              cd /output
              repo-add twitch-chat-window.db.tar.gz twitch-chat-window-*.pkg.tar.zst
            '
      - uses: actions/upload-artifact@v4
        with:
          name: TwitchChatWindow-linux-x64
          path: TwitchChatWindow-linux-x64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TwitchChatWindow-pacman
          path: |
            out/pacman/twitch-chat-window-*.pkg.tar.zst
            out/pacman/twitch-chat-window.db.tar.gz
            out/pacman/twitch-chat-window.files.tar.gz
          if-no-files-found: error

  windows:
    name: Build Windows EXE
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: .\Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TwitchChatWindow-windows
          path: TwitchChatWindow.exe
          if-no-files-found: error
